site_name: Deep State of Mind (DSOM)
site_description: A metacognitive governance framework for AI.
site_author: Harisfazillah Jamel (LinuxMalaysia)
repo_url: https://github.com/linuxmalaysia/deep-state-of-mind-for-my-ai
site_url: https://linuxmalaysia.github.io/deep-state-of-mind-for-my-ai/
edit_uri: blob/main/docs/
copyright: 'All costs, designs, unit amounts, and scenarios detailed within this document are based entirely on assumptions. This project and its accompanying documentation are compiled strictly for training, educational, and planning proposal purposes. Use at your own risk. We will not be responsible. We have done our best to protect anyone and organisation. <a href="https://linuxmalaysia.github.io/deep-state-of-mind-for-my-ai/LEGAL-NOTICE/">Legal Notice & Disclaimer</a>'

hooks:
  - tools/mkdocs_hooks.py

exclude_docs: |
  !.agents

validation:
  links:
    absolute_links: warn
    unrecognized_links: ignore

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Inter
    code: Roboto Mono
  palette:
    # Palette toggle for automatic mode based on system preference
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

