name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Native OpenWiki Emulator
        run: uv run --with pyyaml python tools/openwiki_emulator.py --update

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            openwiki
            AGENTS.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki knowledge graph natively"
          title: "docs: update OpenWiki knowledge graph natively"
          body: |
            Automated OpenWiki documentation update generated natively via Python (`tools/openwiki_emulator.py`).
