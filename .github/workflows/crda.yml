#
# Snyk — Open Source Dependency Vulnerability Scan (Python)
#
# Replaces the deprecated Red Hat CRDA workflow (gw.api.openshift.io is offline).
#
# Scans are triggered:
#   1. On every push to the main branch (when requirements.txt changes)
#   2. On every Pull Request targeting main
#   3. On a weekly schedule (every Monday at 00:00 UTC)
#   4. Manually, on demand, via workflow_dispatch
#
# This workflow:
#   - Checks out the repository
#   - Sets up Python 3.12
#   - Installs Snyk CLI
#   - Scans requirements.txt for known vulnerabilities
#   - Uploads SARIF results to GitHub Code Scanning (Security tab)
#
# Prerequisites:
#   - SNYK_TOKEN must be added to repository Secrets:
#     GitHub → Settings → Secrets and variables → Actions → New repository secret
#   - Obtain your token from: https://app.snyk.io/account → Auth Token
# ==============================================================================

name: Snyk Security Scan

on:
  push:
    branches: [ "main" ]
    paths:
      - "requirements.txt"
      - ".github/workflows/crda.yml"

  pull_request:
    branches: [ "main" ]
    paths:
      - "requirements.txt"
      - ".github/workflows/crda.yml"

  schedule:
    # Every Monday at 00:00 UTC — weekly dependency health check
    - cron: "0 0 * * 1"

  workflow_dispatch:

concurrency:
  group: snyk-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  snyk-scan:
    name: Snyk — Python Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Snyk vulnerability scan
        uses: snyk/actions/python@master
        continue-on-error: true          # Allow SARIF upload even if vulnerabilities found
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif --severity-threshold=low

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk-python-scan
