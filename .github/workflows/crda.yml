#
# Red Hat CodeReady Dependency Analytics (CRDA) — Security Scan
#
# Scans are triggered:
#   1. On every push to the main branch
#   2. On every Pull Request targeting main
#   3. On a weekly schedule (every Monday at 00:00 UTC)
#   4. Manually, on demand, via workflow_dispatch
#
# This workflow:
#   - Checks out the repository
#   - Sets up Python 3.12 (for tools/dsom_token_auditor.py dependency scanning)
#   - Installs CRDA CLI
#   - Scans requirements.txt against the Red Hat Vulnerability Database
#   - Uploads the SARIF result to GitHub Code Scanning (Security tab)
#   - Uploads the SARIF file as a downloadable workflow artifact
#
# Prerequisites:
#   - Add CRDA_KEY or SNYK_TOKEN to repository Secrets:
#     Settings → Secrets and variables → Actions → New repository secret
#   - CRDA_KEY: Obtain from https://app.crda.redhat.com/
#   - SNYK_TOKEN: Obtain from https://app.snyk.io/account
# ==============================================================================

name: CRDA Security Scan

on:
  push:
    branches: [ "main" ]
    paths:
      - "requirements.txt"
      - ".github/workflows/crda.yml"

  pull_request:
    branches: [ "main" ]
    paths:
      - "requirements.txt"
      - ".github/workflows/crda.yml"

  schedule:
    # Every Monday at 00:00 UTC — weekly dependency health check
    - cron: "0 0 * * 1"

  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload SARIF file as workflow artifact"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: crda-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crda-scan:
    name: CRDA — Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read           # for actions/checkout to fetch code
      security-events: write   # for redhat-actions/crda to upload SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install CRDA CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          source: github
          github_pat: ${{ github.token }}
          crda: "latest"

      - name: Run CRDA Dependency Scan
        id: crda-scan
        uses: redhat-actions/crda@v1
        with:
          # crda_key: ${{ secrets.CRDA_KEY }}       # Alternative to SNYK_TOKEN
          snyk_token: ${{ secrets.SNYK_TOKEN }}
          manifest_file: requirements.txt
          upload_artifact: ${{ github.event.inputs.upload_artifact || 'true' }}
          fail_on: "warning"                         # Fail on warning or higher severity

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.crda-scan.outputs.crda_report_sarif }}
          category: crda-dependency-scan
