# ==============================================================================
#
# This workflow automates the building and publishing of the MkDocs site
# to GitHub Pages (the 'gh-pages' branch) on every push to the 'main' branch.
#
# Deploying to 'gh-pages' allows the repository owner to select this branch
# as the publishing source in GitHub Repository Settings -> Pages.
#
# Triggers:
#   1. On push to 'main'
#   2. On manual workflow_dispatch
# ==============================================================================

name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure subsequent runs cancel previous in-progress runs on the same branch
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-pages:
    name: Build and Deploy MkDocs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material pyyaml

      - name: Build MkDocs Site & Unified Sitemaps
        run: |
          python tools/generate_sitemaps.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "docs(pages): auto-deploy MkDocs site [skip ci]"
