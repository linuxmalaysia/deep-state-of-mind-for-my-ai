---
- name: Check | Database password is provided
  ansible.builtin.assert:
    that:
      - gitea_db_password is defined
      - gitea_db_password | length > 0
    fail_msg: "gitea_db_password must be set to a non-empty value (e.g., via vault_gitea_db_password)."

- name: Check | User lingering is enabled
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user_id | default(ansible_user) }}"
  changed_when: false

- name: TLS | Generate and deploy TLS certificates
  ansible.builtin.import_tasks: tls.yml

- name: Check | Quadlet directory exists
  ansible.builtin.file:
    path: "~/.config/containers/systemd"
    state: directory
    mode: "0755"

- name: Check | Quadlet YAML deployed
  ansible.builtin.template:
    src: "gitea-stack.yaml.j2"
    dest: "~/.config/containers/systemd/gitea-stack.yaml"
    mode: "0600"
  notify: Reload systemd user daemon and restart gitea-stack

- name: Quadlet | Deploy Gitea Kube Quadlet Unit
  ansible.builtin.template:
    src: "gitea-stack.kube.j2"
    dest: "~/.config/containers/systemd/gitea-stack.kube"
    mode: "0644"
  notify: Reload systemd user daemon and restart gitea-stack

- name: Check | Gitea Quadlet service is started
  ansible.builtin.systemd_service:
    name: gitea-stack.service
    state: started
    scope: user
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
